#스프링 앱의 설정 파일, 코드에 직접 박아두면 안 되는 값들, 즉 환경마다 달라지는 값이나 동작 방식을 여기에 모아둠
# 스프링 부트는 실행할 떄 이 파일을 먼저 읽고 그대로 세팅함

spring:
  application:
    name: asset-management
    #application.name은 앱 이름표. 로그나 모니터링에서 어떤 앱인지 구분
  config:
    import: optional:file:.env[.properties]
    #config.import는 .env 파일을 읽어와서 그 안의 값을 ${MYSQL_USER} 처럼 가져다 쓸 수 있게 함.
    #덕분에 비밀번호가 이 파일에 직접 안 적혀서, 이 파일은 깃허브에 올려도 안전
  datasource:
    url: jdbc:mysql://localhost:3306/asset_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Seoul
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    #datasource는 어떤 DB에 어떤 계정으로 붙을지
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    #jpa는 DB를 다루는 방식에 대한 설정 ddl-auto: update는 앞으로 만들 자바 엔티티 클래스를 보고 테이블을 자동으로 만들거나 고쳐줌
    #show-sql: true는 스프링이 DB에 날리는 SQL을 콘솔에 보여줍니다. 공부할 때 이게 정말 중요. java 코드 한 줄이 실제 어떤 SQL로 바뀌는지 보임